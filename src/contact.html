<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<base href="./">
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="assets/css/base/main.css">
		
		<title>Contact</title>
		<template data-include="partials/head.html"></template>

	</head>
	
	<body class="subpage">

		<div data-include="partials/header.html"></div>
		
		<div id="main" class="container">

			<h3 class="align-center">Formulario de Contacto</h3>
			<p class="contact-lead">¿Tienes un proyecto en mente o quieres reservar una sesión? Escríbeme y te respondo lo antes posible.</p>

			<form method="post" action="mailto:antonioopopooter@gmail.com" enctype="text/plain">

				<div class="row uniform">
					<div class="6u 12u$(xsmall)">
						<label class="sr-only" for="name">Nombre</label>
						<input type="text" name="name" id="name" value="" placeholder="Nombre"></div>
					<div class="6u$ 12u$(xsmall)">
						<label class="sr-only" for="email">Email</label>
						<input type="email" name="email" id="email" value="" placeholder="Email"></div>

					<div class="12u$">
						<label class="sr-only" for="message">Mensaje</label>
						<textarea name="message" id="message" placeholder="Cuéntame sobre tu proyecto" rows="6"></textarea>
					</div>

					<div class="12u$" style="text-align: center;">
						<ul class="actions">
							<li>
								<input type="submit" value="Enviar Mensaje">
							</li>
						</ul>
					</div>
				</div>
			</form>

		</div>

		<div data-include="partials/footer.html"></div>

		<!-- HTML includes (sync): must run before the scripts below -->
		<script src="assets/js/include.js"></script>

		<!-- Scripts -->
		<script src="assets/js/vendor/jquery.min.js"></script>
		<script src="assets/js/vendor/jquery.scrollex.min.js"></script>
		<script src="assets/js/vendor/skel.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

	</body>
</html>
